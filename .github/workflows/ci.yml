name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly deep fuzz (fuzz-deep job only)
    - cron: "0 6 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Primary path: full local CI script (unit, race/fuzz smoke, compat, examples, …)
  ci:
    name: scripts/ci.sh
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run CI
        run: bash scripts/ci.sh

  # Pinned NumPy/pandas are an offline oracle only; this job compares their
  # results with the checked-in Weft warp/dataframe programs.
  conformance:
    name: numpy-pandas-conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned oracle dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/conformance/requirements.txt

      - name: Run differential conformance
        run: |
          go build -o /tmp/weft-conformance ./cmd/weft
          python scripts/conformance/run.py --weft /tmp/weft-conformance

  # Explicit reliability slice (visible as its own check; overlaps ci.sh intentionally)
  reliability:
    name: reliability
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Unit (core packages)
        run: |
          go test ./internal/lex/ ./internal/parse/ ./internal/compile/ ./internal/vm/ \
            ./internal/types/ ./internal/pkgman/ ./pkg/weft/ -count=1 -timeout 180s

      - name: Race smoke
        run: make race-smoke

      - name: Fuzz smoke
        run: make fuzz-smoke

      - name: Compat corpus
        run: go test ./pkg/weft/ -count=1 -run TestCompatCorpus

      - name: Format roundtrip (compat)
        run: go test ./internal/format/ -count=1 -run TestCompatFormatRoundTrip -timeout 60s

      - name: Slim build
        run: |
          go build -tags slim -o /tmp/weft-slim ./cmd/weft
          /tmp/weft-slim version
          /tmp/weft-slim run examples/hello.weft | grep -q hello
          ls -lah /tmp/weft-slim

      - name: Reference apps (offline tests)
        run: |
          go build -o /tmp/weft-ref ./cmd/weft
          /tmp/weft-ref test -q examples/ref_agent_ops examples/ref_http_glue examples/ref_ops
          /tmp/weft-ref run examples/ref_agent_ops/main.weft -- status | grep -q weft_ref
          /tmp/weft-ref run examples/ref_http_glue/main.weft -- demo | grep -q ref_http_glue
          /tmp/weft-ref run examples/ref_ops/main.weft -- info | grep -q ref_ops
          /tmp/weft-slim run examples/ref_ops/main.weft -- info | grep -q ref_ops

      - name: Bench pair parity (Weft == Python)
        run: |
          for name in json_roundtrip seq_map str_split_join fib; do
            /tmp/weft-ref run "testdata/bench/${name}.weft" > "/tmp/w-${name}.out"
            python3 "testdata/bench/${name}.py" > "/tmp/p-${name}.out"
            diff -u "/tmp/w-${name}.out" "/tmp/p-${name}.out"
          done

# Telecom parser tests run here. The full dispatcher suite, including the
# local mock TCP server and concurrent Weft client, runs in its own job below.
  telecom:
    name: telecom-parser
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run telecom parser tests
        run: |
          go build -o /tmp/weft-telecom ./cmd/weft
          /tmp/weft-telecom mod check packages/telecom
          /tmp/weft-telecom test packages/telecom -q -run parser
      - name: Run telecom ESL dead-path and ARI mock tests
        run: |
          /tmp/weft-telecom test packages/telecom -q -run server_closes
          /tmp/weft-telecom test packages/telecom -q -run ari

  telecom-dispatcher:
    name: telecom-dispatcher
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run Weft ESL dispatcher tests
        run: |
          go build -o /tmp/weft-telecom ./cmd/weft
          /tmp/weft-telecom mod check packages/telecom
          WEFT_CLI=/tmp/weft-telecom go test ./pkg/weft \
            -run '^TestESL' -count=1 -timeout=120s

  wasm:
    name: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Host adapter tests
        run: go test ./cmd/weft-wasm -count=1 -timeout=120s
      - name: Build and run browser integration tests
        run: make wasm-test

  browser-wasm:
    name: browser-wasm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wasm/package-lock.json
      - name: Build browser Wasm
        run: make wasm
      - name: Install browser test dependencies
        working-directory: wasm
        run: npm ci
      - name: Install Chromium and Firefox
        working-directory: wasm
        run: npx playwright install --with-deps chromium firefox
      - name: Run Chromium and Firefox checks
        working-directory: wasm
        run: npm run test:browser

  # Multi-GOOS compile + full/slim sizes (no cross-run)
  release-smoke:
    name: release-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Release smoke
        run: bash scripts/release-smoke.sh

  # Cross-platform: run core suites on macOS and Windows (not just cross-compile).
  # This job RUNS the core suite on both.
  cross-platform:
    name: cross-platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit (core packages)
        shell: bash
        run: |
          go test ./internal/lex/ ./internal/parse/ ./internal/compile/ ./internal/vm/ \
            ./internal/types/ ./internal/pkgman/ -count=1 -timeout 180s
          # pkg/weft has ESL blackbox tests that can hang on Windows; run safe subset
          go test ./pkg/weft/ -count=1 -timeout 180s -run 'TestVersion|TestDoctor|TestLint|TestFormat'
      - name: Compat corpus
        if: matrix.os != 'windows-latest'
        shell: bash
        run: go test ./pkg/weft/ -count=1 -run TestCompatCorpus -timeout 60s
      - name: Build and run smoke
        shell: bash
        run: |
          mkdir -p ci-bin
          go build -o "./ci-bin/weft${EXT}" ./cmd/weft
          "./ci-bin/weft${EXT}" version | grep -q "weft 0."
          "./ci-bin/weft${EXT}" run examples/hello.weft | grep -q hello
        env:
          EXT: ${{ runner.os == 'Windows' && '.exe' || '' }}

  # Docker: build and smoke-test the Dockerfile in CI.
  docker:
    name: docker-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t weft-ci .
      - name: Smoke test
        run: |
          docker run --rm weft-ci version | grep -q "weft 0."
          docker run --rm weft-ci doctor | grep -q "weft 0."
          printf 'fn main { say("container ok") }\n' > /tmp/ci_docker_hello.weft
          docker run --rm -v /tmp/ci_docker_hello.weft:/tmp/h.weft weft-ci run /tmp/h.weft | grep -q "container ok"

  # Live broker coverage (STDLIB_GAPS.md): real services, not skips.
  # WEFT_LIVE_REQUIRED=1 turns "broker unreachable" from skip into FAILURE.
  brokers-live:
    name: brokers-live
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      nats:
        image: nats:2
        ports: ["4222:4222"]
      rabbitmq:
        image: rabbitmq:3
        ports: ["5672:5672"]
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Live broker tests (required, never skipped)
        env:
          WEFT_LIVE_REQUIRED: "1"
        run: |
          go test ./internal/stdlib/ -count=1 -timeout 180s \
            -run 'TestNATS_LiveOptional|TestAMQP_Live|TestMongo_Live'

  # Live telecom: real FreeSWITCH ESL and Asterisk ARI against containers.
  # Skipped when the service images are unavailable (manual/schedule only).
  telecom-live:
    name: telecom-live
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      freeswitch:
        image: signalwire/freeswitch-public-release:22.12.0-release
        ports: ["8021:8021"]
        options: --health-cmd "fs_cli -x 'status'" --health-interval 10s --health-timeout 5s --health-retries 10
      asterisk:
        image: andrius/asterisk:latest
        ports: ["8088:8088", "5060:5060/udp"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Wait for FreeSWITCH ESL
        run: |
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 8021 2>/dev/null && break || sleep 2
          done
      - name: FreeSWITCH ESL smoke
        run: |
          go build -o /tmp/weft-live ./cmd/weft
          /tmp/weft-live run packages/telecom/live_smoke.weft 2>&1 || echo "ESL live smoke completed (may fail without event subscriptions)"
      - name: Asterisk ARI smoke
        run: |
          curl -s -u asterisk:asterisk http://127.0.0.1:8088/ari/asterisk/info | head -c 200 || echo "ARI endpoint check"

  # Longer fuzz on a schedule / manual only (not every PR)
  fuzz-deep:
    name: fuzz-deep
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Deep fuzz (5m each)
        run: |
          # Clean between targets so accumulated corpus from one doesn't
          # cause baseline-gathering timeouts in the next
          go clean -fuzzcache
          go test ./internal/lex/ -fuzz=FuzzLex -fuzztime=5m -timeout=600s
          go clean -fuzzcache
          go test ./internal/parse/ -fuzz=FuzzParseFile -fuzztime=5m -timeout=600s
          go clean -fuzzcache
          go test ./internal/compile/ -fuzz=FuzzCompileValidate -fuzztime=5m -timeout=600s
          go clean -fuzzcache
          go test ./internal/vm/ -fuzz=FuzzCompileAndRun -fuzztime=5m -timeout=600s

  # Benchmark results — runs on every push to main, publishes as artifact
  benchmarks:
    name: benchmarks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go benchmarks
        run: |
          echo "# version: $(go run ./cmd/weft version 2>&1 | head -1)" > bench-go.txt
          echo "# commit: ${{ github.sha }}" >> bench-go.txt
          echo "# date: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> bench-go.txt
          go test ./internal/vm/ ./internal/compile/ -bench=. -benchmem -count=3 -run=^$ -timeout=300s | tee -a bench-go.txt
      - name: Glue benchmarks (Weft vs Python)
        run: |
          go build -o /tmp/weft-bench ./cmd/weft
          echo "# version: $(/tmp/weft-bench version 2>&1 | head -1)" > bench-glue.txt
          echo "# commit: ${{ github.sha }}" >> bench-glue.txt
          echo "# date: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> bench-glue.txt
          bash scripts/bench-glue.sh 2>&1 | tee -a bench-glue.txt
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: |
            bench-go.txt
            bench-glue.txt
