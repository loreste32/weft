name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # keyless cosign signing via GitHub OIDC
  packages: write # push container image to ghcr.io

jobs:
  release:
    name: build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4

      - name: Check tag matches pkg/weft.Version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CODE=$(sed -n 's/^const Version = "\(.*\)"/\1/p' pkg/weft/weft.go)
          if [ "$TAG" != "$CODE" ]; then
            echo "tag v$TAG does not match pkg/weft.Version ($CODE)" >&2
            exit 1
          fi

      - name: Build binaries (full + slim, 5 platforms)
        run: |
          set -euo pipefail
          mkdir -p dist/bin
          VERSION=$(sed -n 's/^const Version = "\(.*\)"/\1/p' pkg/weft/weft.go)
          for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos=${pair%/*}
            goarch=${pair#*/}
            ext=""
            [ "$goos" = "windows" ] && ext=".exe"
            for flavor in full slim; do
              tags=""
              suffix=""
              if [ "$flavor" = "slim" ]; then
                tags="-tags slim"
                suffix="-slim"
              fi
              echo "  $goos/$goarch ($flavor)"
              # shellcheck disable=SC2086
              GOOS=$goos GOARCH=$goarch go build $tags -trimpath -buildvcs=false -o "dist/bin/weft${ext}" ./cmd/weft
              pkg="weft-${VERSION}-${goos}-${goarch}${suffix}"
              if [ "$goos" = "windows" ]; then
                (cd dist/bin && zip -q "../${pkg}.zip" "weft${ext}")
              else
                (cd dist/bin && tar -czf "../${pkg}.tar.gz" "weft${ext}")
              fi
              rm "dist/bin/weft${ext}"
            done
          done
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS)

      - name: Offline install + reproducible build gate
        run: bash scripts/reproducible-build-check.sh

      - name: SBOM
        run: bash scripts/sbom.sh dist/SBOM.json

      - name: Package VS Code extension
        run: |
          bash scripts/package-vscode.sh
          cp editors/vscode/weft-*.vsix dist/

      - name: Install cosign (keyless signing)
        if: startsWith(github.ref, 'refs/tags/')
        uses: sigstore/cosign-installer@v3

      - name: Sign release blobs
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          for f in dist/*.tar.gz dist/*.zip dist/*.vsix dist/SHA256SUMS dist/SBOM.json; do
            cosign sign-blob --yes --bundle "${f}.cosign-bundle" "$f"
          done
          echo "signed artifacts: $(ls dist/*.cosign-bundle | wc -l)"

      - name: Artifacts
        run: ls -la dist

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Built by GitHub Actions run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (includes offline-install + byte-reproducibility gate, SBOM generation, and keyless cosign signing).
            CI for this commit: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/ci.yml?query=sha%3A${{ github.sha }}
            Verify: `cosign verify-blob --bundle <artifact>.cosign-bundle <artifact>` against the repo's GitHub OIDC identity; hashes in `SHA256SUMS`; dependency inventory in `SBOM.json`.

      - name: Upload artifacts (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: weft-release-dist
          path: dist/*

  # Container image → ghcr.io/loreste32/weft (same root Dockerfile as the
  # docker-image job in ci.yml, but pushed with semver tags on v* releases).
  docker:
    name: publish docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/loreste32/weft
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
